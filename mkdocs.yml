site_name: BluePeak Documentation
site_url: https://flame101a1.github.io/BLUEPEAK-DEVELOPMENT-DOCS/
site_description: Installation guides, configuration, and developer references for BluePeak Development resources.
site_author: BluePeak Development
copyright: BluePeak Development · Resource credits and license preserved in Credits
strict: true
docs_dir: docs
site_dir: site
theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/bluepeak-logo.png
  favicon: assets/bluepeak-logo.png
  palette:
    scheme: slate
    primary: custom
    accent: blue
  features:
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - md_in_html
extra:
  generator: false
extra_css:
  - assets/theme.css
nav:
  - Documentation: index.md
  - Guides & references: guides.md
  - Inventory:
      - Overview: inventory/index.md
      - Getting started:
          - Installation: inventory/installation.md
          - Configuration: inventory/configuration.md
          - Item definitions: inventory/items.md
      - Gameplay guides:
          - Backpacks & equipment: inventory/guides/equipment.md
          - Vehicle storage & weapon racks: inventory/guides/vehicles.md
          - Animations: inventory/guides/animations.md
      - API reference:
          - Server functions: inventory/functions/server.md
          - Client functions: inventory/functions/client.md
      - Troubleshooting: inventory/troubleshooting.md
      - Credits & license: inventory/credits.md
